<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pixel Fishing</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; height: 100dvh; background: #05070d; overflow: hidden; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; }
      #mobile-controls { display: none; }
      @media (max-width: 760px), (pointer: coarse) {
        body[data-scene="Fishing"] #mobile-controls {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 20;
          pointer-events: none;
          color: #fff4d6;
          font: 600 12px/1 system-ui, sans-serif;
          user-select: none;
          -webkit-user-select: none;
        }
        #mobile-controls button {
          display: grid;
          place-items: center;
          min-width: 44px;
          min-height: 44px;
          padding: 0;
          border: 1px solid rgba(255, 233, 196, .75);
          border-radius: 12px;
          background: rgba(36, 31, 28, .82);
          color: inherit;
          font: inherit;
          font-size: 15px;
          box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
          touch-action: none;
          -webkit-tap-highlight-color: transparent;
          pointer-events: auto;
        }
        #mobile-controls button:active,
        #mobile-controls button.is-active {
          background: rgba(170, 104, 49, .96);
          transform: scale(.96);
        }
        #mobile-shortcuts {
          position: absolute;
          top: max(72px, calc(env(safe-area-inset-top) + 60px));
          right: max(12px, env(safe-area-inset-right));
          left: max(12px, env(safe-area-inset-left));
          display: flex;
          justify-content: flex-end;
          gap: 5px;
          pointer-events: none;
        }
        #mobile-shortcuts button {
          min-width: 40px;
          min-height: 38px;
          padding: 0 5px;
          font-size: 11px;
          pointer-events: auto;
        }
        #mobile-bottom {
          position: absolute;
          right: max(12px, env(safe-area-inset-right));
          bottom: max(88px, calc(env(safe-area-inset-bottom) + 64px));
          left: max(12px, env(safe-area-inset-left));
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          pointer-events: none;
        }
        #movement-stick {
          order: 2;
          position: relative;
          width: 142px;
          height: 142px;
          flex: 0 0 142px;
          border: 1px solid rgba(255, 233, 196, .58);
          border-radius: 50%;
          background: rgba(27, 38, 48, .55);
          pointer-events: auto;
          touch-action: none;
        }
        #movement-stick.is-active { background: rgba(57, 72, 81, .78); }
        #stick-knob {
          position: absolute;
          top: 43px;
          left: 43px;
          width: 54px;
          height: 54px;
          border: 1px solid rgba(255, 233, 196, .8);
          border-radius: 50%;
          background: rgba(180, 130, 77, .92);
          box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
          pointer-events: none;
        }
        #mobile-actions {
          order: 1;
          display: grid;
          grid-template-columns: repeat(2, 58px);
          gap: 8px;
          pointer-events: none;
        }
        #mobile-actions button { min-width: 58px; min-height: 54px; }
        #mobile-actions [data-mobile-action="fish"] {
          grid-column: span 2;
          min-height: 62px;
          border-radius: 18px;
          background: rgba(129, 72, 32, .94);
          font-size: 13px;
        }
        @media (max-width: 380px) {
          #movement-stick { transform: scale(.88); transform-origin: bottom right; margin-left: -16px; margin-bottom: -8px; }
          #mobile-actions { grid-template-columns: repeat(2, 52px); gap: 6px; }
          #mobile-actions button { min-width: 52px; min-height: 50px; }
          #mobile-actions [data-mobile-action="fish"] { min-height: 56px; }
          #mobile-shortcuts { gap: 4px; }
          #mobile-shortcuts button { min-width: 38px; min-height: 36px; }
        }
      }
        #world-chat-panel {
          display: none;
          position: fixed;
          z-index: 30;
          top: 50%;
          left: 50%;
          width: min(390px, calc(100vw - 28px));
          height: min(440px, 62dvh);
          transform: translate(-50%, -50%);
          flex-direction: column;
          gap: 8px;
          padding: 12px;
          border: 2px solid #d9b074;
          border-radius: 12px;
          background: rgba(37, 26, 18, .97);
          color: #fff4d6;
          font: 13px/1.35 system-ui, sans-serif;
          box-shadow: 0 8px 30px rgba(0, 0, 0, .6);
          pointer-events: auto;
        }
        body[data-world-chat-open="true"][data-scene="Fishing"] #world-chat-panel { display: flex; }
        #world-chat-toggle {
          display: none;
          position: fixed;
          z-index: 29;
          top: 50%;
          right: max(12px, env(safe-area-inset-right));
          transform: translateY(-50%);
          min-width: 42px;
          min-height: 112px;
          padding: 10px 7px;
          border: 2px solid #d9b074;
          border-radius: 12px;
          background: rgba(37, 26, 18, .97);
          color: #fff4d6;
          font: 700 13px/1.2 system-ui, sans-serif;
          writing-mode: vertical-rl;
          cursor: pointer;
        }
        @media (min-width: 761px) {
          body[data-scene="Fishing"] #world-chat-panel {
            top: 112px;
            right: max(12px, env(safe-area-inset-right));
            bottom: max(88px, env(safe-area-inset-bottom));
            left: auto;
            width: min(320px, 32vw);
            height: auto;
            transform: none;
          }
          body[data-scene="Fishing"]:not([data-world-chat-open="true"]) #world-chat-toggle { display: block; }
        }
        #world-chat-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        #world-chat-title { font-weight: 700; }
        #world-chat-close {
          min-width: 38px;
          min-height: 36px;
          padding: 0;
          border: 1px solid rgba(255, 233, 196, .75);
          border-radius: 8px;
          background: rgba(36, 31, 28, .9);
          color: inherit;
          font: inherit;
          touch-action: manipulation;
        }
        #world-chat-messages {
          flex: 1;
          overflow-y: auto;
          overscroll-behavior: contain;
          padding: 8px;
          border: 1px solid rgba(217, 176, 116, .55);
          border-radius: 8px;
          background: rgba(9, 14, 23, .72);
          overflow-wrap: anywhere;
        }
        .world-chat-message { margin: 0 0 7px; }
        .world-chat-name { color: #a6e36a; font-weight: 700; }
        #world-chat-form { display: flex; gap: 6px; }
        #world-chat-input {
          flex: 1;
          min-width: 0;
          padding: 9px;
          border: 1px solid #d9b074;
          border-radius: 8px;
          background: #2b1d10;
          color: #fff4d6;
          font: inherit;
          font-size: 16px;
        }
        #world-chat-form button {
          min-width: 60px;
          padding: 0 10px;
          border: 1px solid #d9b074;
          border-radius: 8px;
          background: #6b4a2a;
          color: inherit;
          font: inherit;
          touch-action: manipulation;
        }
        @media (orientation: landscape) and (max-height: 500px) {
          #mobile-shortcuts { top: max(46px, calc(env(safe-area-inset-top) + 40px)); }
          #mobile-bottom { bottom: max(6px, env(safe-area-inset-bottom)); }
          #movement-stick { transform: scale(.82); transform-origin: bottom right; margin-left: -24px; margin-bottom: -10px; }
          #mobile-actions { grid-template-columns: repeat(2, 50px); gap: 5px; }
          #mobile-actions button { min-width: 50px; min-height: 44px; }
          #mobile-actions [data-mobile-action="fish"] { min-height: 48px; }
        }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="mobile-controls" aria-label="Touch game controls">
      <nav id="mobile-shortcuts" aria-label="Game menus">
        <button type="button" data-mobile-action="map" aria-label="Open map">Map</button>
        <button type="button" data-mobile-action="bag" aria-label="Open bag">Bag</button>
        <button type="button" data-mobile-action="bait" aria-label="Change bait">Bait</button>
        <button type="button" data-mobile-action="book" aria-label="Open fish book">Book</button>
      </nav>
      <div id="mobile-bottom">
        <div id="movement-stick" role="application" aria-label="Movement joystick">
          <div id="stick-knob"></div>
        </div>
        <div id="mobile-actions" aria-label="Game actions">
          <button type="button" data-mobile-action="fish" aria-label="Hold to cast or reel">Fish</button>
          <button type="button" data-mobile-action="interact" aria-label="Interact or use">Use</button>
          <button type="button" data-mobile-action="boat" aria-label="Place boat">Boat</button>
          <button type="button" data-mobile-action="tent" aria-label="Place tent">Tent</button>
          <button type="button" data-mobile-action="chat" aria-label="Open world chat">Chat</button>
        </div>
      </div>
    </div>
    <button type="button" id="world-chat-toggle" aria-controls="world-chat-panel" aria-expanded="false">World chat</button>
    <aside id="world-chat-panel" aria-labelledby="world-chat-title">
      <header id="world-chat-header">
        <div>
          <div id="world-chat-title">World chat</div>
          <small>Chat with anglers on every map</small>
        </div>
        <button type="button" id="world-chat-close" aria-label="Close world chat">Close</button>
      </header>
      <div id="world-chat-messages" role="log" aria-live="polite">
        <p id="world-chat-empty">Connecting to world chat…</p>
      </div>
      <form id="world-chat-form">
        <input id="world-chat-input" type="text" maxlength="80" autocomplete="off" placeholder="Say something…" aria-label="World chat message" />
        <button type="submit">Send</button>
      </form>
    </aside>
    <script type="module" src="/src/main.ts"></script>
    <script>
      (() => {
        const emit = (detail) => window.dispatchEvent(new CustomEvent('pixel-fishing:mobile-control', { detail }));
        const chatToggle = document.getElementById('world-chat-toggle');
        const stick = document.getElementById('movement-stick');
        const knob = document.getElementById('stick-knob');
        const chatInput = document.getElementById('world-chat-input');
        const chatMessages = document.getElementById('world-chat-messages');
        let chatStatus = document.getElementById('world-chat-empty');
        let stickPointer = null;
        let fishPointer = null;
        let nextChatMessageId = 0;
        let pendingChatMessageId = null;

        const sendMove = (x, y) => {
          emit({ type: 'move', x, y });
        };
        const releaseAll = () => {
          stick?.classList.remove('is-active');
          if (knob) knob.style.transform = 'translate(0, 0)';
          stickPointer = null;
          fishPointer = null;
          sendMove(0, 0);
          emit({ type: 'fish', pressed: false });
        };

        const moveStick = (event) => {
          if (stickPointer !== event.pointerId) return;
          const rect = stick.getBoundingClientRect();
          const radius = rect.width * .32;
          let x = (event.clientX - (rect.left + rect.width / 2)) / radius;
          let y = (event.clientY - (rect.top + rect.height / 2)) / radius;
          const magnitude = Math.hypot(x, y);
          if (magnitude > 1) { x /= magnitude; y /= magnitude; }
          if (Math.hypot(x, y) < .18) x = y = 0;
          knob.style.transform = `translate(${x * radius}px, ${y * radius}px)`;
          sendMove(x, y);
        };
        stick.addEventListener('pointerdown', (event) => {
          if (stickPointer !== null) return;
          event.preventDefault();
          stickPointer = event.pointerId;
          stick.setPointerCapture(event.pointerId);
          stick.classList.add('is-active');
          moveStick(event);
        });
        stick.addEventListener('pointermove', moveStick);
        const releaseStick = (event) => {
          if (stickPointer !== event.pointerId) return;
          event.preventDefault();
          stickPointer = null;
          stick.classList.remove('is-active');
          knob.style.transform = 'translate(0, 0)';
          sendMove(0, 0);
        };
        stick.addEventListener('pointerup', releaseStick);
        stick.addEventListener('pointercancel', releaseStick);
        stick.addEventListener('lostpointercapture', releaseStick);

        document.querySelectorAll('[data-mobile-action]').forEach((button) => {
          const action = button.dataset.mobileAction;
          if (action === 'fish') {
            const press = (event) => {
              event.preventDefault();
              if (fishPointer !== null) return;
              fishPointer = event.pointerId;
              button.setPointerCapture?.(event.pointerId);
              button.classList.add('is-active');
              emit({ type: 'fish', pressed: true });
            };
            const release = (event) => {
              event.preventDefault();
              if (fishPointer === null) return;
              fishPointer = null;
              button.classList.remove('is-active');
              emit({ type: 'fish', pressed: false });
            };
            button.addEventListener('pointerdown', press);
            button.addEventListener('pointerup', release);
            button.addEventListener('pointercancel', release);
            button.addEventListener('lostpointercapture', release);
            return;
          }
          button.addEventListener('click', (event) => {
            event.preventDefault();
            emit({ type: 'action', action });
          });
        });

        document.getElementById('world-chat-close').addEventListener('click', () => {
          emit({ type: 'action', action: 'closeChat' });
        });
        chatToggle.addEventListener('click', () => {
          emit({ type: 'action', action: 'chat' });
        });
        document.getElementById('world-chat-form').addEventListener('submit', (event) => {
          event.preventDefault();
          const text = chatInput.value.trim();
          if (!text || pendingChatMessageId !== null) return;
          pendingChatMessageId = ++nextChatMessageId;
          emit({ type: 'chat-submit', id: pendingChatMessageId, text });
        });
        window.addEventListener('pixel-fishing:chat-send-result', (event) => {
          if (event.detail?.id !== pendingChatMessageId) return;
          if (event.detail.sent) chatInput.value = '';
          else chatInput.focus();
          pendingChatMessageId = null;
        });
        chatInput.addEventListener('keydown', (event) => {
          event.stopPropagation();
          if (event.key === 'Escape') {
            event.preventDefault();
            emit({ type: 'action', action: 'closeChat' });
          }
        });
        window.addEventListener('pixel-fishing:world-chat-message', (event) => {
          const { name, text } = event.detail;
          chatStatus?.remove();
          chatStatus = null;
          const message = document.createElement('p');
          message.className = 'world-chat-message';
          const label = document.createElement('span');
          label.className = 'world-chat-name';
          label.textContent = `${name}: `;
          message.append(label, document.createTextNode(text));
          chatMessages.appendChild(message);
          while (chatMessages.childElementCount > 60) chatMessages.firstElementChild.remove();
          chatMessages.scrollTop = chatMessages.scrollHeight;
        });
        window.addEventListener('pixel-fishing:world-chat-status', (event) => {
          const status = event.detail?.text;
          if (!status) return;
          if (!chatStatus) {
            chatStatus = document.createElement('p');
            chatStatus.id = 'world-chat-empty';
            chatMessages.prepend(chatStatus);
          }
          chatStatus.textContent = status;
        });
        window.addEventListener('pixel-fishing:world-chat-open', () => {
          chatToggle.setAttribute('aria-expanded', 'true');
          chatInput.focus();
        });
        window.addEventListener('pixel-fishing:world-chat-close', () => {
          chatToggle.setAttribute('aria-expanded', 'false');
          chatInput.blur();
        });
        window.addEventListener('blur', releaseAll);
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) releaseAll();
        });
      })();
    </script>
  </body>
</html>
